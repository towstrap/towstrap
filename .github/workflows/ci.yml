name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Vet (windows)
        run: GOOS=windows go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: go build ./...

      - name: Cross-compile check (windows)
        run: GOOS=windows GOARCH=amd64 go build ./...
