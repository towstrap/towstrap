# towstrap.vast-plan.com —— 官方服务器的 nginx 反代示例。
#
# towstrap-server 只监听 127.0.0.1:7880（见 examples/server.yaml），对外
# 只有 443：/agent、/mcp、/install.sh、/install.ps1、/status、/health、
# /oauth/*、/skill 全按路径分发。
#
# ⚠ 反代的安全代价要想清楚：挂了反代后服务端看到的来源 IP 全是
#    127.0.0.1——agent_allow_ips、登录限速的按 IP 配额会被压成同一个
#    桶，等于这些按 IP 的控制在 HTTP 面上失效（SSH :7822 直连不受影响）。
#    要保 IP 控制就别走反代直连 towstrap，或确认你只把反代当 TLS 终点、
#    不指望按 IP 挡人。X-Forwarded-For 头是客户端可伪造的，服务端不拿
#    它做判定。
#
# ⚠ 反代跑在 Docker 容器里（Nginx Proxy Manager 等面板）：容器内的
#    127.0.0.1 是容器自己——转发到 127.0.0.1:7880 必然 502。把
#    server.yaml 的 http 绑到 docker0 网桥（默认 172.17.0.1）或内网
#    IP，allow_plain_http: true，反代目标填该地址；并确认面板里开了
#    WebSocket 转发（/agent 是长连接，不开 agent 会掉线）。
#
# SSH（:7822）是裸协议、没有路径概念，nginx 按路径分发不了它——保持
# 7822 端口直连（安全组/防火墙放行即可），想换端口用 stream 块按端口转。

upstream towstrap {
    server 127.0.0.1:7880;
    keepalive 32;
}

# /agent 是 WebSocket：Upgrade/Connection 头要按请求头原样转发。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name towstrap.vast-plan.com;

    ssl_certificate     /etc/letsencrypt/live/towstrap.vast-plan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/towstrap.vast-plan.com/privkey.pem;

    # 后端只有 towstrap 自己的端点，全路径转发即可。/agent 是常驻 WebSocket
    # （30s 心跳），读写超时给足，别让 nginx 把长连接掐了。
    location / {
        proxy_pass http://towstrap;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# HTTP 跳 HTTPS。
server {
    listen 80;
    server_name towstrap.vast-plan.com;
    return 301 https://$host$request_uri;
}

# ── SSH 入口（可选）：协议不是 HTTP，放 stream 块按端口转发 ──────────────
# 想在别的端口上开 SSH 入口（如 22022）：
#
# stream {
#     server {
#         listen 22022;
#         proxy_pass 127.0.0.1:7822;
#     }
# }
#
# 注意 stream 和 http 是同级块，放 nginx.conf 主文件，不在 sites-enabled 里。
