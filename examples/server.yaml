server:
  http: "127.0.0.1:7880" # /health、/agent、/status——对外只经 nginx（见 examples/nginx.conf）
  ssh: ":7822"         # SSH 入口（裸协议没有路径，nginx 按路径分发不了，单独开端口）
  host_key: /var/lib/towstrap/ssh_host_key
  users_db: /etc/towstrap/users.db    # 账号 SQLite 库（towstrap-server user 改的就是它）
  users_key: /etc/towstrap/users.key  # token 加密密钥（不写则用 users.db 同名的 .key；务必备份）
  audit_log: /var/lib/towstrap/server-audit.log  # 服务器审计：认证/agent/会话事件（16MB 轮转；/dev/null 关）
  public_url: wss://towstrap.vast-plan.com # 写进 user add 生成的安装命令
  # admin_token: 查 /status 用的管理口令（可选；账号 token 也能查）

  # agent_defaults：本服务器下发的安装脚本会把这些写进装好的 agent.yaml
  #（只影响新装的机器；server/agent_token* 会被忽略——地址由脚本生成、
  # token 一机一份）。字段名就是 agent.yaml 的字段。
  # agent_defaults:
  #   shell: "/bin/zsh"       # agent 上 PTY 会话用哪个 shell
  #   mirror_idle: "48h"      # 镜像终端闲置多久自动终结（0/off 不启用）
  #   quiet: false            # 关掉会话开始/结束的通知
  #   mcp_policy: "server"    # 这台机器对 MCP 审批的姿态（server/open）

  # register：开 /register 自助注册——被控机上 `towstrap register` 交互建
  # 账号+拿 token，不用管理员预先建号。同一机器指纹只许注册一个账号，
  # 每来源 IP 每小时限 8 个。配 register_invite 则注册要带邀请码。
  # register: true
  # register_invite: ""       # 可选：邀请码；空 = 不验

  # tls: true                  # 网页口走 HTTPS/WSS；不给 cert/key 会自动生成自签证书
  # cert: /etc/towstrap/cert.pem # 正式证书（Let's Encrypt 等）配在这里
  # key: /etc/towstrap/key.pem
  # allow_ips: [10.0.0.0/8]    # 全局：谁能连 SSH；账号还可以再设自己的白名单
  # idle_verify: 30m           # 绑了 TOTP 的账号挂机超过这么久，下次敲键重验验证码（0 关闭）
  # max_sessions: 16           # 每台机器（每账号）并发 SSH 会话上限（0 不限）
  # max_conns: 4096            # SSH/HTTP 各自并发连接总上限（0 不限）
  # max_conns_per_ip: 64       # SSH 每来源 IP 并发连接上限（只对 SSH；0 不限）
  # ssh_idle_timeout: 30m      # SSH 空闲超时（治未认证连接挂死；会断开空闲会话，慎开）
  # ssh_max_timeout: 24h       # SSH 连接绝对寿命（0 不限）

  # ── 内嵌 MCP（Streamable HTTP）────────────────────────────
  # 打开后 LLM 客户端用 Bearer token 直连 /mcp，命令经 Hub 在 agent 上执行，
  # 不绕 SSH。客户端凭据用 towstrap-server mcp add 签发（存在 users_db 的
  # mcp_clients 表里，加密存放）。
  # mcp:
  #   enabled: true
  #   path: /mcp               # 挂的路径，默认 /mcp
  #   # Bearer token 是凭据：tls 没开且监听非回环地址时拒绝启动。
  #   # 确认只在内网/隧道里跑才允许明文：
  #   # allow_plain_http: true
  #   # approvals_dir: /var/lib/towstrap/approvals  # 默认：审计日志目录旁的 approvals/
  #   # 待批请求写在这（默认就有：客户端不支持批准弹窗时 auto 也走本地待批），
  #   # 用 towstrap-server mcp pending / approve <id> / deny <id> 在服务器上处理。
  #   # local_notify 默认开——待批时弹「允许/拒绝」系统对话框 + wall 广播 +
  #   # 提示行写进同账号在登的 towstrap SSH 终端；headless 机器自动静默退化，
  #   # 嫌吵可显式 local_notify: false 关掉。
  #   # local_notify: false
  #   # ——有的 MCP 客户端声称支持批准弹窗却渲染不出来，policy.ask_via: local
  #   # 是绕开它的现成办法（auto 下它会把调用挂到超时）。
  #   # machines 是 MCP 侧元数据（说明 + write_file 自动放行目录），
  #   # 键 = 机器完整 ID（账号+机器名，如 bot+default）；客户端能看哪几台
  #   # 由它 token 的 --machine 列表定，这里不配也能跑，只是没说明、
  #   # write_file 没有自动放行目录。
  #   machines:
  #     bot+default:
  #       description: 办公机
  #       roots: ["~/work"]     # 目录里别放指向外面的符号链接
  #   # policy/limits 与 examples/mcp.yaml 同格式（deny/ask/allow/default/
  #   # ask_via/ask_timeout 及 timeout/max_timeout/max_output/max_file），
  #   # 不写用内置默认。
